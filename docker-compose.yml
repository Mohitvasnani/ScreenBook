# Local Postgres for ScreenBook.
#   cp .env.example .env   (then set DB_PASSWORD)
#   docker compose up -d
services:
  postgres:
    # postgis/postgis, not postgres, because V15 creates the postgis
    # extension. Still Postgres 18, so the volume path below is unchanged:
    # 18 moved it to /var/lib/postgresql and these images follow that.
    image: postgis/postgis:18-3.6-alpine
    container_name: screenbook-postgres
    environment:
      POSTGRES_DB: screenbook
      POSTGRES_USER: postgres
      # A local throwaway database, so a well-known dev password is fine and
      # removes a setup step. Real credentials only ever exist in Render/Neon.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - screenbook-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d screenbook"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  screenbook-pgdata: