# Local Postgres for ScreenBook.
#   cp .env.example .env   (then set DB_PASSWORD)
#   docker compose up -d
services:
  postgres:
    # postgis/postgis, not postgres, because V15 creates the postgis
    # extension. Still Postgres 18, so the volume path below is unchanged:
    # 18 moved it to /var/lib/postgresql and these images follow that.
    image: postgis/postgis:18-3.6-alpine
    container_name: screenbook-postgres
    environment:
      POSTGRES_DB: screenbook
      POSTGRES_USER: postgres
      # A local throwaway database, so a well-known dev password is fine and
      # removes a setup step. Real credentials only ever exist in Render/Neon.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - screenbook-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d screenbook"]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine
    container_name: screenbook-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: screenbook-prometheus
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:12.1.0
    container_name: screenbook-grafana
    profiles: ["observability"]
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/screenbook.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
volumes:
  screenbook-pgdata:

