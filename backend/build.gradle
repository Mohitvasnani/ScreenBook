plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mohit'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// Generates the OpenAPI document from the controllers and serves Swagger UI.
	// The 3.x line targets Spring Boot 4; the 2.x line is for Boot 3.
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Brings Nimbus JOSE, so JWTs are encoded and decoded by Spring Security
    // itself rather than by a third-party DSL. The resource-server filter does
    // the verifying; a custom resolver points it at the cookie instead of the
    // Authorization header.

    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'

    // Boot 4 split autoconfiguration into per-feature modules. RestClient the
    // class ships with spring-web, but the autoconfiguration that creates the
    // RestClient.Builder bean lives here. Without it the app compiles, the
    // tests pass (the -test starter pulls it in transitively) and the context
    // fails to refresh at runtime. BrevoMailer is the only consumer.
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
}


tasks.named('test') {
	useJUnitPlatform()
	// Print every test as it runs, not just the failures, and give full stack
	// traces. Worth it on a project whose headline test is a concurrency one.
	testLogging {
		events 'passed', 'skipped', 'failed'
		exceptionFormat 'full'
		showStandardStreams = false
	}
}
/* javac keeps deprecation detail off by default, so a build normally just says
   some deprecated API was used somewhere. Naming the file and line is what
   turns the warning in ApiExceptionHandler into something I can explain rather
   than something I have to ignore. unchecked is here for the same reason. */
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:deprecation' << '-Xlint:unchecked'
}

/* bootRun is a Gradle task that never runs in production, where the app starts
   from the jar inside the Docker image. Supplying a local value here does not
   weaken the no-default rule on COOKIES_SECURE: a misconfigured deployment
   still refuses to start. It only stops that rule from costing a setup step in
   every new terminal. An explicitly set variable still wins. */
tasks.named('bootRun') {
	environment 'COOKIES_SECURE',
			providers.environmentVariable('COOKIES_SECURE').getOrElse('false')
}

