# Test-only. A fixed value so tokens are reproducible across a run, and so the
# suite does not depend on a developer having exported anything.
#
# A profile-specific file rather than src/test/resources/application.properties,
# which would shadow the main one entirely instead of layering on top of it.
screenbook.jwt.secret=test-secret-at-least-thirty-two-bytes-long-abcdef
screenbook.cookies.secure=false
# Off in tests. 6,700 screenings across 240 screens is close to a million rows
# in seat_availability, and ConcurrencyTest finds its seats by scanning it.
# ShowtimeSeederTest calls the seeder directly instead, inside a transaction
# that rolls back.
screenbook.seed.enabled=false