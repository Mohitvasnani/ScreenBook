spring.application.name=screenbook

# ---------------------------------------------------------------- datasource
# No secret in this file. Local dev uses a throwaway Postgres whose password is
# literally "postgres"; production supplies all three via environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/screenbook}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ------------------------------------------------------------------- Hikari
# Ten, not a smaller number: ConcurrencyTest runs eight threads that each hold
# a connection while blocked on the seat lock, so a pool below that would make
# the test hang on the pool instead of proving anything. The coupling is real,
# so it is written down here rather than left to a default.
spring.datasource.hikari.maximum-pool-size=10
# Keep no idle connections. Neon suspends a compute after five minutes of
# inactivity; a pool that holds connections open works against that and spends
# the free tier's compute-hour budget on an app nobody is using.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
# Retire a connection before anything upstream does, so a request is never
# handed one that the far end has already closed.
spring.datasource.hikari.max-lifetime=600000

# ---------------------------------------------------------------------- JPA
# Hibernate only checks that entities match the tables. Flyway owns the schema.
spring.jpa.hibernate.ddl-auto=validate
# Stops lazy loading from silently running queries during the web response.
spring.jpa.open-in-view=false
# Prints the SQL JPA runs, which is the point of building this to learn SQL.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------- Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# -------------------------------------------------------------------- server
# Render injects PORT and routes to whatever it says. 8082 locally.
server.port=${PORT:8082}
# Make Spring's own thrown errors come out as RFC 9457 problem+json too, so a
# malformed request body looks like our errors rather than a Spring stack trace.
spring.mvc.problemdetails.enabled=true

# ------------------------------------------------------------------- OpenAPI
# ------------------------------------------------------------------- OpenAPI
# Public on purpose: the API surface is the point of this project, so Swagger
# stays reachable in production. Flipping SPRINGDOC_ENABLED to false on the
# host turns both off without a redeploy, which is what you would want the day
# this stopped being a portfolio piece.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ------------------------------------------------------------------ screenbook
# How long a hold lasts. Externalised so the expiry tests can shorten it
# instead of waiting five minutes.
screenbook.hold.ttl-seconds=300
# Upper bound on the showtimes list. A booking app shows what is on soon.
screenbook.showtimes.max-results=12
# Guests get three, accounts get six. Not a nag: it is a reason to sign in that
# costs a guest nothing for the common case of one or two seats.
screenbook.holds.max-seats-guest=3
screenbook.holds.max-seats-member=6

# ---------------------------------------------------------------------- CORS
# Origins allowed to call /api/**, comma separated. Production sets
# SCREENBOOK_CORS_ALLOWED_ORIGINS on Render to the Vercel URL.
screenbook.cors.allowed-origins=http://localhost:3000

# ------------------------------------------------------------------ actuator
# Render's health check hits /actuator/health.
management.endpoints.web.exposure.include=health,info

# ---------------------------------------------------------------------- auth
# No default on purpose. A development fallback is exactly the value that ends
# up signing production tokens the day someone forgets to set the variable, and
# an app that will not start is a better failure than one that starts insecure.
screenbook.jwt.secret=${JWT_SECRET}
# Short, because it is never checked against the database. Revocation happens
# at refresh time, so this is the longest a revoked session stays alive.
screenbook.jwt.access-ttl-minutes=15
# Long, because it is checked every time and can be deleted.
screenbook.jwt.refresh-ttl-days=30
# No default, for the same reason as the secret above. A forgotten variable in
# production would silently ship session cookies with no Secure attribute and
# nothing would look wrong, so the app refuses to start instead. Local runs set
# COOKIES_SECURE=false explicitly: a one-time setup step rather than a trap.
screenbook.cookies.secure=${COOKIES_SECURE}

# ------------------------------------------------------------------ pricing
# Whole percentages, as basis points, added to the seat's listed price. Values
# are multiples of 1000 bp so every adjustment lands on a whole rupee.
screenbook.pricing.occupancy.half-full-bp=1000
screenbook.pricing.occupancy.nearly-full-bp=2000
screenbook.pricing.occupancy.half-full-threshold=50
screenbook.pricing.occupancy.nearly-full-threshold=80
screenbook.pricing.lead-time.soon-bp=500
screenbook.pricing.lead-time.imminent-bp=1000
screenbook.pricing.lead-time.soon-hours=48
screenbook.pricing.lead-time.imminent-hours=6
screenbook.pricing.time-of-day.evening-bp=500
screenbook.pricing.time-of-day.evening-from=17:00
screenbook.pricing.time-of-day.evening-to=22:59
screenbook.pricing.day-of-week.weekend-bp=500
screenbook.pricing.day-of-week.weekend-days=FRIDAY,SATURDAY
# Local time decides whether a show is an evening or a weekend one. starts_at
# is an instant, so without an explicit zone this reads the server's default
# and a Render container in UTC would disagree with a laptop. Same class of bug
# as the Locale.ROOT fix in Emails.
screenbook.pricing.zone=Asia/Kolkata
# Backstop. The four rules can only reach 4000 bp, so with this config the cap
# never fires. It exists so a mistyped band cannot produce a four-figure
# ticket, and because a legal ceiling has to be expressible: several Indian
# states cap cinema ticket prices by law.
screenbook.pricing.max-adjustment-bp=4000

# ------------------------------------------------------------ password reset
# Short, because the token arrives by email and sits in an inbox. Long enough
# that someone can finish reading the message.
screenbook.reset.ttl-minutes=30
# How long before the same account can request another link. The endpoint sends
# mail to an address an attacker supplies, which makes it a way to flood someone
# else's inbox and burn the sender's reputation. This is the cheapest correct
# rate limit: the table can already answer it, so it needs no Redis and no
# bucket. 60 seconds is short enough that a lost email is not a lockout.
screenbook.reset.min-request-interval-seconds=60

# Which Mailer bean is active. "log" prints the link to the console and is the
# default, so the flow works on a fresh clone with no account anywhere.
screenbook.mail.provider=${MAIL_PROVIDER:log}
# Where the link in the email points. The frontend owns that route, so this is
# a frontend URL and has to change per environment.
screenbook.reset.link-base=${RESET_LINK_BASE:http://localhost:3000/reset-password}

# Only read when screenbook.mail.provider is brevo, because that is the only
# condition under which the bean exists. No default, same reason as
# JWT_SECRET: a placeholder here is a deployment that silently sends nothing.
screenbook.mail.brevo.api-key=${BREVO_API_KEY:}
# Must be the address verified in Brevo as a single sender. Anything else is
# rejected at send time, not at startup.
screenbook.mail.brevo.sender-email=${BREVO_SENDER_EMAIL:}
screenbook.mail.brevo.sender-name=${BREVO_SENDER_NAME:ScreenBook}

# Applies to every RestClient this app builds, which is currently only the
# Brevo one. Without them a hung provider hangs the request thread.
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=10s
# ------------------------------------------------------------------ seeding
# A migration seeds once and its data is a photograph of the day it ran. This
# runs on every startup and converges instead, so the demo cannot go dry.
screenbook.seed.enabled=true
# How far ahead to keep screenings. A week, which is what a cinema site lists.
screenbook.seed.days=7
# Local wall clock times at each cinema, not UTC. Four shows a screen a day.
screenbook.seed.slots=10:30,13:40,16:50,20:00
# How long a finished screening sticks around before housekeeping removes it.
# Only ones with no booking and no hold are ever deleted.
screenbook.seed.keep-past-days=2
# How many cinemas the nearest-N list returns when the client does not say.
# Five is a list a person reads, not a page they scroll.
screenbook.cinemas.nearest-default-results=5
# The cap. Larger requests are clamped to this rather than rejected: a client
# that does not know the limit should get an answer, not an error it has to
# guess its way out of.
screenbook.cinemas.nearest-max-results=20